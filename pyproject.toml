[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witness"
version = "0.1.0"
description = "The witness, record and experience layer of Narrow Highway — an application that calls the core engine over HTTP. One engine, one corpus, two surfaces."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy>=1.24",   # the Scribe's SVD spec-ambiguity detector; the core itself stays stdlib-only
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
nh-scribe = "nh_org.scribe.orchestrate:_main"

[tool.setuptools.packages.find]
include = ["nh_org*"]

[tool.ruff]
line-length = 120
