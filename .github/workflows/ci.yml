name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: lint (syntax / undefined names)
        run: ruff check nh_org tools tests --select E9,F63,F7,F82
      - name: tests (offline — the live core test auto-skips without NH_CORE_LIVE)
        run: python -m pytest -q
